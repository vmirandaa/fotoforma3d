<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f6f4ee">
  <title>Reservas | FORMA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="type-scale.css">
  <link rel="stylesheet" href="admin.css">
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>
</head>
<body id="top" class="admin-page">
  <div class="topline"><span>FORMA · PANEL PRIVADO</span><a href="index.html">Ver el sitio <b>↗</b></a></div>
  <header class="header">
    <a class="wordmark" href="index.html" aria-label="FORMA, inicio"><span class="brand-symbol">F</span>FORMA<span class="wordmark-dot">.</span></a>
    <button class="menu-toggle" aria-label="Abrir menú" aria-expanded="false">☰</button>
    <nav class="nav" aria-label="Principal">
      <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false"><span aria-hidden="true">◐</span><span id="theme-label">Modo oscuro</span></button>
      <button class="theme-toggle" id="admin-logout" type="button" hidden>Salir</button>
    </nav>
  </header>
  <main class="admin-main">
    <form class="admin-login" id="admin-login">
      <span class="eyebrow">Panel privado</span>
      <h1>Reservas</h1>
      <p>Ingresa la clave del panel para ver las reservas recibidas.</p>
      <label for="admin-key">Clave</label>
      <input id="admin-key" type="password" autocomplete="current-password" required>
      <button class="button button-dark" type="submit">Entrar <span>↗</span></button>
      <p class="admin-message" id="login-message" role="status" aria-live="polite"></p>
    </form>

    <section class="admin-board" id="admin-board" hidden>
      <div class="admin-heading">
        <div><span class="eyebrow">Panel privado</span><h1>Reservas</h1></div>
        <button class="button button-dark" id="admin-refresh" type="button">Actualizar <span>⟳</span></button>
      </div>
      <div class="admin-summary" id="admin-summary"></div>
      <p class="admin-message" id="board-message" role="status" aria-live="polite"></p>
      <div class="admin-orders" id="admin-orders"></div>
    </section>
  </main>

  <dialog class="model-dialog" id="model-dialog" aria-labelledby="model-dialog-title">
    <div class="model-dialog-head">
      <div><span class="eyebrow">Modelo de la reserva</span><h2 id="model-dialog-title"></h2></div>
      <button class="theme-toggle" id="model-close" type="button">Cerrar ✕</button>
    </div>
    <div class="model-dialog-stage">
      <model-viewer id="admin-viewer" loading="eager" camera-controls touch-action="pan-y" shadow-intensity="1.1" exposure="1" environment-image="neutral" interaction-prompt="none" alt="Modelo 3D de la reserva"></model-viewer>
      <p class="model-dialog-status" id="model-dialog-status" role="status" aria-live="polite"></p>
    </div>
    <div class="model-dialog-actions">
      <div class="model-finish" role="group" aria-label="Acabado">
        <button type="button" id="view-white" aria-pressed="true">En blanco, como se imprime</button>
        <button type="button" id="view-color" aria-pressed="false">Con sus colores</button>
      </div>
      <button type="button" id="view-download">Descargar modelo ↓</button>
    </div>
  </dialog>
  <script src="script.js"></script>
  <script src="admin.js"></script>
</body>
</html>
